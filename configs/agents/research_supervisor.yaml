strategy_template: |-
  As a research supervisor, your strategy is to:
  1. Understand the research task type and requirements
  2. Track progress through research phases (understanding → implementation → testing → optimization → submission)
  3. Assess code quality and implementation completeness
  4. Provide strategic guidance based on current phase and progress
  5. Identify when intervention is needed to redirect research focus
  6. Ensure research quality and readiness for submission

output_parser: ResearchSupervisorParser
history_processor: Last5Observations

# Configurable research supervision parameters
research_phases:
  - name: understanding
    description: "Understand task requirements and constraints"
    indicators: ["exploration", "file_reading", "baseline_analysis"]
  - name: implementation
    description: "Implement core solution components"
    indicators: ["code_writing", "function_implementation", "file_creation"]
  - name: testing
    description: "Validate and test the implementation"
    indicators: ["validation", "testing", "error_fixing"]
  - name: optimization
    description: "Optimize and improve the solution"
    indicators: ["performance_improvement", "refactoring", "optimization"]
  - name: submission
    description: "Prepare and submit final solution"
    indicators: ["submission", "final_validation", "documentation"]

file_patterns:
  implementation_files: ["strategy", "model", "algorithm", "solution", "main"]
  validation_files: ["validate", "test", "evaluate", "check"]
  configuration_files: ["config", "settings", "params", "hyperparameters"]
  documentation_files: ["readme", "doc", "documentation", "notes"]

command_patterns:
  exploration_commands: ["ls", "cat", "head", "find", "grep", "search"]
  implementation_commands: ["edit", "insert", "create", "write", "echo"]
  validation_commands: ["validate", "test", "run", "execute", "check"]
  submission_commands: ["submit", "finalize", "complete"]

intervention_triggers:
  low_progress_threshold: 0.2
  stuck_phase_threshold: 0.6
  no_implementation_threshold: 0.4
  no_validation_threshold: 0.7
  high_progress_low_score_threshold: 0.8
  feedback_ratio_threshold: 0.5
  exploration_stuck_threshold: 0.3
  repeated_actions_threshold: 20
  low_progress_with_actions_threshold: 0.3 